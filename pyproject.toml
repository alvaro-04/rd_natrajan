[project]
name = "natrajan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alvaro-04", email = "alvaroarroyoroncero@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
    "torch>=2.15.0",
]

[project.scripts]
natrajan = "natrajan:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
